global:
  scrape_interval: 15s

scrape_configs:
  # NestJS 앱 지표
  - job_name: 'nestjs-app'
    static_configs:
      - targets: ['backend:3000']
    metrics_path: '/api/v1/metrics'

  # EC2 서버 지표 (Node Exporter)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
