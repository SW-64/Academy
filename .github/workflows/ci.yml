# 린트 → 타입체크 → 테스트 → 빌드 → 빌드확인 → 보안

name: Kwak-Math CI

on:
  workflow_dispatch: # 수동 실행
  push:
    branches: [dev]
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [dev]

jobs:
  ci-test:
    runs-on: ubuntu-24.04

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Node.js 설정 (package.json에서 버전 확인 필요)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # ← package.json engines 확인 후 수정
          cache: 'npm'

      # 3. 의존성 설치
      - name: Install dependencies
        run: npm ci

      # 4. 린트 체크 - 경고만 (시간 여유 생기면 고침)
      - name: Run lint
        run: npm run lint
        continue-on-error: true # 린트 실패해도 계속 진행

      # 5. 타입 체크 (TypeScript 프로젝트는 필수!)
      - name: Type check
        run: npx tsc --noEmit

      # 6. 테스트 실행
      - name: Run tests
        run: npm run test

      # 7. 빌드 체크 (중요!)
      - name: Build application
        run: npm run build

      # 8. 빌드 아티팩트 확인
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          echo "✅ Build successful: dist directory created"

      # 9. 보안 취약점 체크
      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true # 처음엔 경고만

