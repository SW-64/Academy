# 자격증명 → 스크립트생성 → SSM배포
#     (코드pull → env생성 → 의존성설치 → 빌드 → PM2재시작 → 헬스체크 → 배포요약)

name: Kwak-Math CD

on:
  workflow_dispatch: # 수동 배포
  workflow_run:
    workflows: ['Kwak-Math CI']
    types: [completed]
    branches: [dev]

jobs:
  deploy:
    # CI 성공 시에만 배포
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      # AWS 자격증명
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2
      # 배포 스크립트 생성
      - name: Create deployment script
        run: |
          cat > /tmp/deploy.sh << 'SCRIPT'
          #!/bin/bash
          set -e

          # ubuntu 사용자로 전체 스크립트 실행
          sudo -u ubuntu bash << 'UBUNTU_SCRIPT'


            # ==========================================
            # 1. 환경 설정
            # ==========================================

            # NVM 설정 (Node.js 사용)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"

            echo "🚀 Starting deployment..."
            echo "📅 Deployment time: $(date)"

            # ==========================================
            # 2. 프로젝트 디렉토리로 이동
            # ==========================================

            cd /home/ubuntu/Academy

            # ==========================================
            # 3. 최신 코드 가져오기
            # ==========================================

            echo "📥 Fetching latest code..."
            git switch dev
            git pull origin dev

            # ==========================================
            # 4. .env 파일 생성 (모든 환경변수)
            # ==========================================

            echo "🔐 Creating .env file..."

            # Node 환경
            echo "NODE_ENV=production" > .env
            chmod 600 .env
            echo "SERVER_PORT=${{ secrets.SERVER_PORT }}" >> .env

            # Database (RDS)
            echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env

            # Password
            echo "PASSWORD_HASH=${{ secrets.PASSWORD_HASH }}" >> .env

            # JWT
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}" >> .env

            # Refresh Token
            echo "REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}" >> .env
            echo "REFRESH_TOKEN_EXPIRES_IN=${{ secrets.REFRESH_TOKEN_EXPIRES_IN }}" >> .env
            echo "REFRESH_TOKEN_HASH=${{ secrets.REFRESH_TOKEN_HASH }}" >> .env

            # Cookie
            echo "COOKIE_SAMESITE=${{ secrets.COOKIE_SAMESITE }}" >> .env
            echo "COOKIE_DOMAIN=${{ secrets.COOKIE_DOMAIN }}" >> .env

            # Redis
            echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> .env
            echo "REDIS_PORT=${{ secrets.REDIS_PORT }}" >> .env

            # Link Code
            echo "LINK_CODE_EXPIRES_IN=${{ secrets.LINK_CODE_EXPIRES_IN }}" >> .env

            # S3
            echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env
            echo "S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" >> .env

            # Bunny Video
            echo "BUNNY_API_KEY=${{ secrets.BUNNY_API_KEY }}" >> .env
            echo "BUNNY_LIBRARY_ID=${{ secrets.BUNNY_LIBRARY_ID }}" >> .env
            echo "BUNNY_CDN_HOSTNAME=${{ secrets.BUNNY_CDN_HOSTNAME }}" >> .env

            # ==========================================
            # 5. 의존성 설치
            # ==========================================

            echo "📦 Installing dependencies..."
            npm ci 

            # ==========================================
            # 6. 빌드
            # ==========================================

            echo "🏗️ Building application..."
            npm run build

            # 빌드 검증
            if [ ! -d "dist" ]; then
              echo "❌ Build failed: dist directory not found"
              exit 1
            fi
            echo "✅ Build successful"

            # ==========================================
            # 7. PM2 무중단 재시작
            # ==========================================

            echo "🔄 Restarting PM2 process..."

            # reload: 무중단 재시작
            # 첫 배포면 start, 이후엔 reload
            pm2 reload kwak-math-nest-cicd --update-env || pm2 start dist/main.js --name kwak-math-nest-cicd

            # PM2 설정 저장
            pm2 save

            # ==========================================
            # 8. 헬스체크 (30초 대기)
            # ==========================================

            echo "🏥 Waiting 30 seconds for server to start..."
            sleep 30

            echo "🏥 Running health check..."

            # 헬스체크 엔드포인트 호출
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:${{ secrets.SERVER_PORT }}/api/v1/health || echo "000")

            if [ "$HEALTH_STATUS" = "200" ]; then
              echo "✅ Health check passed (Status: $HEALTH_STATUS)"
              echo "🎉 Deployment completed successfully!"
            else
              echo "❌ Health check failed - Rolling back"
              # 롤백 로직
              exit 1  # ← CI/CD 실패 처리
            fi
            

            # ==========================================
            # 9. 배포 정보 출력
            # ==========================================

            echo ""
            echo "📊 Deployment Summary:"
            echo "- Time: $(date)"
            echo "- Commit: $(git rev-parse --short HEAD)"
            echo "- Branch: $(git branch --show-current)"
            echo "- PM2 Status:"
            pm2 list | grep kwak-math-nest-cicd

          UBUNTU_SCRIPT
          SCRIPT

        # SSM으로 배포
      - name: Deploy via SSM
        run: |
          ENCODED=$(cat /tmp/deploy.sh | base64 -w 0)

          COMMAND_ID=$(aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --document-name "AWS-RunShellScript" \
          --parameters "commands=[\"echo '$ENCODED' | base64 -d | bash\"]" \
          --output text \
          --query "Command.CommandId")

          echo "Command ID: $COMMAND_ID"
          echo "⏳ Waiting for deployment..."

          for i in {1..90}; do
            sleep 10
            
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "InProgress")
            
            echo "[$i/90] Status: $STATUS"
            
            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deployment completed!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            elif [ "$STATUS" = "Failed" ]; then
              echo "❌ Deployment failed!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text
              echo "=== Errors ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
          done

          echo "⏱️ Timeout"
          exit 1
